# Dalvì Interlude · timing and selection rules · v1.0.1
#
# The rules behind automatic suggestions. hooks/select.ts mirrors this file (RULES, zones, pick);
# keep the two in step when either changes.
#
# Settings:
# - Automatic suggestions are on by default, up to max_per_day (0 turns them off). /breathe always works.
# - Friction signals and the AI check are separate, opt-in settings (see signals.yaml and profiles below).
# - Settings, today's counters and recent-suggestion history are stored locally; prompts and inferences never.
#
# Gates every automatic card passes (none apply to an explicit /breathe):
# - 90 minutes of active time (time between the person's own prompts and their turns; a pause over
#   idle_reset_min starts the count again). 90 is a product default, not a biological threshold.
# - Only at the end of a turn the person started, never while Claude is working.
# - Daily limit, snooze, "No more today", quiet hours (local time, wrapping past midnight) and a minimum
#   gap between cards. A waiting card steps aside once quiet hours, "No more today" or a limit of 0 apply.
#
# Selection (hooks/select.ts → pick):
# - Automatic: filter manual-only, time of day, cooldown and exclusions; then rank by signal fit, then the
#   zone's preferred categories (a soft preference, never an instruction), then the least recently offered
#   category, then evidence level; random only among equals.
# - Explicit /breathe: any fitting break at random, for variety. A category choice also opens manual-only ones.
# - If nothing passes, there is no card. Nothing is ever forced.
#
# Language: explicit setting > the language the person writes in > device locale > English.

active_time:
  idle_reset_min: 15
nudges:
  interval_min: 90
  max_per_day: 4
  max_per_day_range:
  - 0
  - 10
  user_configurable: true
  never_during_tool_run: true
  snooze_options_min:
  - 15
  - 30
  - 60
  min_gap_between_nudges_min: 45
  quiet_hours:
    from: '20:00'
    to: 08:00
    user_configurable: false
time_of_day:
  morning: 06:00-11:59
  midday: 12:00-14:59
  afternoon: 15:00-18:59
  evening: 19:00-05:59
time_rules:
- id: morning-open-window
  when:
    zone: morning
  prefer_categories:
  - movement
  - eyes
  rationale: Ήπιο preset, όχι βιολογική υπεροχή πρωινού. Προτιμά μικρή κίνηση ή αλλαγή βλέμματος· δεν συμπεραίνει
    πώς αισθάνεται ο χρήστης.
- id: midday-change-scene
  when:
    zone: midday
  prefer_categories:
  - movement
  rationale: 'Contextual preset: ίσως βολεύει μια μικρή βόλτα. Dunstan 2012, DOI 10.2337/dc11-1931, μελέτησε επαναλαμβανόμενη
    κίνηση μετά γεύμα· η ώρα 12:00 δεν αποδεικνύει ότι ο χρήστης έφαγε.'
- id: afternoon-small-and-quiet
  when:
    zone: afternoon
  prefer_categories:
  - eyes
  - mind
  rationale: 'Preset επιλογής, χωρίς υπόθεση απογευματινής κόπωσης. Η βάση μικρών διαλειμμάτων είναι γενική: Albulescu
    2022, DOI 10.1371/journal.pone.0272460· δεν τεκμηριώνει συγκεκριμένη ώρα.'
- id: no-caffeine-afternoon
  when:
    after: '14:00'
  exclude_tags:
  - caffeine
  rationale: 'Δεν υπάρχει action καφεΐνης στην v1. Μελλοντικό συντηρητικό preset: Drake 2013, DOI 10.5664/jcsm.3170,
    n=12, 400 mg έως 6 ώρες πριν ύπνο. Δεν τεκμηριώνει καθολικό όριο 14:00 ή ότι μικρότερη δόση νωρίτερα είναι
    ασφαλής για ύπνο.'
- id: evening-shutdown
  when:
    zone: evening
  prefer_categories:
  - shutdown
  rationale: 'Μόνο ήπια προτίμηση αν ο χρήστης επιλέγει τέλος εργασίας· 19:00 δεν σημαίνει τέλος βάρδιας. Wendsche
    2017, DOI 10.3389/fpsyg.2016.02072: συσχετίσεις αποσύνδεσης/ανάκαμψης, όχι δοκιμή αυτού του preset. Αλλιώς
    διατηρούνται μη-shutdown επιλογές.'
- id: evening-no-sleep-promise
  when:
    zone: evening
  exclude_tags:
  - caffeine
  rationale: 'Καμία πρόταση διεγερτικού το βράδυ. Το bedtime action παραμένει manual-only: Scullin 2018, DOI 10.1037/xge0000374,
    αφορά αμέσως πριν ύπνο και όχι οποιαδήποτε βραδινή ώρα.'
selection:
  order:
  - filter_time_of_day
  - apply_time_rules
  - filter_cooldown
  - prefer_signal_match
  - rotate
  - prefer_higher_evidence
  exclude_tags_for_automatic:
  - manual-only
  exclude_tags_for_automatic_rationale: 'Κανόνας προϊόντος (όχι κανόνας ώρας): οι απαιτητικές/ειδικές επιλογές
    ανοίγουν μόνο με ρητή επιλογή χρήστη από το μενού /breathe, με έλεγχο καταλληλότητας. Ισχύει για κάθε αυτόματη
    πρόταση και για το fallback.'
profiles:
  default:
    signals_llm: opt_in
    heuristics: opt_in
  enterprise:
    signals_llm: 'off'
    signals_llm_locked: true
    heuristics: opt_in
