      n: 57
      finding: 5 λεπτά λίστας μελλοντικών υποχρεώσεων πριν τον ύπνο συνδέθηκαν με ταχύτερη έλευση ύπνου από λίστα
        ολοκληρωμένων εργασιών.
      limitations: Υγιείς 18–30 ετών, μία εργαστηριακή νύχτα. Όχι θεραπεία αϋπνίας· δεν τεκμηριώνεται ίδιο αποτέλεσμα
        στις 19:00.
  fits:
