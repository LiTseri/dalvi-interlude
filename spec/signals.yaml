# Dalvì Interlude · friction signals · v1.0.1
#
# Source of truth for the cue phrases, the success phrases, the AI-check consent text and the
# signal → category mapping. `python3 build-catalog.py` turns them into hooks/signals-data.ts;
# `python3 build-catalog.py --check` fails if that file is out of date.
#
# How the signals work (implemented in hooks/signals.ts):
# - Off by default. On with `/breathe signals on`. Only prompts the person types are read.
# - Each prompt is read in memory: fenced and inline code, quoted lines, quoted strings and
#   log-looking lines are removed; text about examples or quotes ("for example", "write a message")
#   is skipped. Comparison is lowercase, accent-insensitive, on whole words.
# - A cue phrase right after a negation ("I don't need a break", «δεν χρειάζομαι διάλειμμα») does not count.
# - Only the cue kind and its time are kept, for 10 minutes; never the words.
# - stuck: one explicit report («έχω κολλήσει», "I'm stuck"), or unchanged failure in two separate
#   prompts within 10 minutes. frustrated and fatigued: one explicit first-person report.
# - Priority when several apply: fatigued > frustrated > stuck > long_session.
# - An explicit success («τώρα δουλεύει», "fixed now") clears all cues.
# - Every card still passes the gates in rules.yaml (daily limit, quiet hours, snooze, 45-minute gap).
# - Nothing here diagnoses emotions or health; the phrases only describe how the work is going.

cues:
  frustrated:
    el: [με εκνευρίζει, έχω εκνευριστεί, δεν αντέχω άλλο, με έχει τρελάνει, έχω τρελαθεί]
    en: [so frustrating, "i'm frustrated", i am frustrated, "can't stand this", driving me crazy]
  unchanged_failure:
    el: [ακόμα δεν δουλεύει, πάλι δεν δουλεύει, ακόμα δεν δούλεψε, ίδιο σφάλμα, ίδιο λάθος, δεν άλλαξε τίποτα]
    en: [still not working, "still doesn't work", still does not work, still fails, still failing,
         still broken, same error, nothing changed]
  stuck_report:
    el: [έχω κολλήσει, κόλλησα, δεν ξέρω τι άλλο να, τίποτα δεν δούλεψε, καμία λύση δεν]
    en: ["i'm stuck", i am stuck, "don't know what else to", do not know what else to, nothing worked,
         none of the fixes]
  fatigued:
    el: [κουράστηκαν τα μάτια μου, δεν μπορώ να συγκεντρωθώ, χρειάζομαι διάλειμμα, έχω κουραστεί,
         είμαι κουρασμένη, είμαι κουρασμένος]
    en: [my eyes are tired, my eyes feel tired, "can't focus", cannot focus, need a break, "i'm tired",
         i am tired, "i'm exhausted"]

success_clears:
  el: [τώρα δουλεύει, δουλεύει τώρα, λύθηκε, διορθώθηκε, δούλεψε, τέλεια]
  en: [works now, it works, fixed now, that worked, that fixed it, solved, perfect]

# Signal → preferred break categories, in order.
mapping:
  stuck: [movement, mind]
  frustrated: [breathing, mind]
  fatigued: [eyes, movement, hydration]
  long_session: [movement, eyes, mind, hydration]

# The optional AI check.
llm:
  model: haiku
  when: >-
    Opt-in (/breathe ai on, then /breathe ai agree); locked off when the profile option is enterprise.
    Runs only when the local signals already found friction and a break would pass every gate; it
    confirms or drops that friction. If the model is unreachable or refused, the local signal stands.
  sends: up to the last 5 typed prompts, each passed through the same clean-up as above and cut to 600 characters
  acts_if: state is stuck, frustrated or fatigued with confidence ≥ 0.7 (a threshold, not a validated calibration)
  stores: nothing (neither the prompts nor the answer)
  consent_text:
    el: >-
      Αν το ενεργοποιήσεις: όταν φαίνεται ότι η δουλειά κόλλησε, έως 5 πρόσφατα μηνύματά σου στέλνονται στο
      Claude Haiku, για να κρίνει αν ταιριάζει ένα διάλειμμα. Πριν σταλούν αφαιρούνται τα μπλοκ κώδικα σε ```,
      οι παραθέσεις και οι γραμμές log, και το καθένα κόβεται στους 600 χαρακτήρες· άλλο επικολλημένο κείμενο,
      π.χ. config ή JSON χωρίς ```, μπορεί να συμπεριληφθεί. Η αποστολή γίνεται μέσα από την ίδια σύνδεση και
      τα ίδια διαπιστευτήρια που ήδη χρησιμοποιεί το Claude Code και μετράει στη δική σου χρήση. Ο πάροχος (η
      Anthropic ή ο cloud πάροχος του οργανισμού σου) το επεξεργάζεται όπως κάθε άλλο μήνυμά σου, με τους δικούς
      του όρους. Το εργαλείο δεν αποθηκεύει ούτε τα μηνύματα ούτε το αποτέλεσμα. Ενεργοποιούνται επίσης οι
      τοπικές ενδείξεις τριβής (/breathe signals).
    en: >-
      If you turn this on: when work seems stuck, up to 5 of your recent messages are sent to Claude Haiku to
      judge whether a break fits. Before sending, fenced code blocks, quotes and log lines are removed and each
      message is cut to 600 characters; other pasted text, such as config or JSON without ```, may be included.
      It goes through the same connection and credentials Claude Code already uses and counts toward your own
      usage. The provider (Anthropic, or your organisation's cloud provider) processes it like any other message
      of yours, under its own terms. This tool stores neither the messages nor the result. Local friction
      signals (/breathe signals) are turned on too.

# Ideas considered and not built, kept for reference:
# - retry_loop / rapid_fire: prompt-rate heuristics. Rejected: frequency alone says little about friction.
# - rejected_revision: "this change doesn't work" across revisions of one request. Needs the AI check to
#   judge reliably; not built.
# Card messages per signal live in ui-copy.yaml (card_messages).
